org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
# Hilt's Gradle plugin can be finicky with the configuration cache; leave it off for reliable builds.
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

kotlin.code.style=official
ksp.useKSP2=true

# The Rust core (libcalzone_ffi.so per ABI, Kotlin bindings, the host lib for
# tests), built by `make core` in the sibling calzone-server repo.
# Override with -PczCoreDir=...
czCoreDir=../calzone-server/dist
# The server tag whose core a release build uses (.github/workflows/release.yml
# builds it from source; CI too). Bump it when the app needs a newer core.
czCoreRef=v0.7.0
